<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} · {{ settings.site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav>
    <div class="nav-container">
        <div class="logo-group">
            <img src="{{ url_for('static', filename='images/Logo Tel-U.png') }}" alt="Logo Tel-U">
            <img src="{{ url_for('static', filename='images/Logo AILO Horizontal.png') }}" alt="Logo AILO">
            <img src="{{ url_for('static', filename='images/Logo Inar Aksara.png') }}" alt="Logo Inar Aksara">
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="{% block nav_home %}{% endblock %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
            <a href="{{ url_for('about') }}" class="{% block nav_about %}{% endblock %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>About</span></a>
            <a href="{{ url_for('peneliti') }}" class="{% block nav_peneliti %}{% endblock %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg><span>Peneliti</span></a>
        </div>
    </div>
</nav>
{% if settings.announcement %}<div class="announcement">{{ settings.announcement }}</div>{% endif %}
{% block content %}{% endblock %}
<footer><p>&copy; 2026 {{ settings.site_name }} Indonesia. All rights reserved.</p></footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
